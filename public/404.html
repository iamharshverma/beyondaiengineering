<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Beyond AI Engineering | Redirecting...</title>
    <script>
      // Single Page Application redirect for GitHub Pages
      (function() {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        // Redirect to root with path in query parameter 'p'
        window.location.replace('/?p=' + encodeURIComponent(path + (search ? search : '') + (hash ? hash : '')));
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="/">Beyond AI Engineering</a>...</p>
  </body>
</html>
